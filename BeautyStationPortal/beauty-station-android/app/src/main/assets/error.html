<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
       background:linear-gradient(135deg,#ff7fa0,#f2588a);color:#1E1E24;text-align:center}
  .card{background:rgba(255,255,255,.92);border-radius:24px;padding:30px 24px;max-width:360px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.12)}
  .heart{font-size:2.6rem;color:#F23B6C}
  h1{font-size:1.35rem;margin:10px 0 8px}
  p{font-size:.9rem;line-height:1.45;color:#4a4a55}
  code{display:block;margin:12px 0 4px;padding:8px;border-radius:10px;background:#fdf0f2;color:#F23B6C;font-size:.8rem;word-break:break-all}
  button{display:block;width:100%;height:46px;border:0;border-radius:999px;font-size:.95rem;font-weight:700;margin-top:12px}
  .primario{background:#F23B6C;color:#fff}
  .secundario{background:#fff;color:#F23B6C;border:1.5px solid #FF6F91}
</style>
</head>
<body>
  <div class="card">
    <div class="heart">&#9825;</div>
    <h1>No pudimos conectar con Beauty Station</h1>
    <p>Revisa que el servidor (Tomcat) esté encendido y que tu conexión funcione.</p>
    <code id="servidor"></code>
    <button class="primario" onclick="BSApp.reintentar()">Reintentar</button>
    <button class="secundario" onclick="BSApp.cambiarServidor()">Cambiar servidor</button>
  </div>
  <script>
    try { document.getElementById('servidor').textContent = BSApp.servidor(); } catch (e) {}
  </script>
</body>
</html>
